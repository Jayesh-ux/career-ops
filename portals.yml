#   keywords: ["AI", "大模型"]   # each keyword is a separate server-side query, results deduped;
#                                # omit keywords to pull the whole board
#   max_pages: 20          # optional per-keyword page cap (100 posts/page, default 20)
#   enabled: true
#
# - name: 美团 (Meituan)
