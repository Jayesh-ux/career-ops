# Comeet needs the full careers-api URL (it carries a per-tenant token that a
# branded careers page does not expose), so set it via the api: field — e.g.:
#
#   - name: Spark Hire
#     careers_url: https://www.comeet.com/jobs/spark-hire/30.005
