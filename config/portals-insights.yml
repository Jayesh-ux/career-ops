channel_notes:
  - >-
    The 78 historic applications were sourced almost entirely from websearch + Indian job boards + direct finds (small
    companies with direct recruiter emails) — NOT from the ATS API feeds. ATS feeds are the high-VOLUME discovery
    channel (69% of scans), not the high-CONVERSION apply channel.
  - >-
    Direct ATS API feeds (greenhouse-api, ashby-api, lever-api, amazon-api, solidjobs-api, workable-api) found the most
    new matches with no login wall, but those roles (big-tech/enterprise) mostly scored low or were skipped for this
    profile. Use them to monitor volume; expect low conversion.
  - >-
    ATS browser scans (greenhouse, ashby, lever) are the Playwright fallback for companies without an open API; they hit
    bot-detection more often, so API feeds should run first.
  - >-
    Email was the dominant submission path (31 confirmed email vs 4 form fills): most applied companies listed a direct
    recruiter/HR email, so capturing it reliably from the posting page is the highest-leverage parser fix.
  - >-
    Insights are ADVISORY per user. Shared portals.yml is never overwritten; per-user ranking is applied at execution
    time from this file.
